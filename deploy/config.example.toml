# Example aq configuration: ~/.config/agent-queue/config.toml
# Every key is shown with its default value.

# Memory of the task pool. Must not exceed MemTotal minus the reserve floor.
pool_memory = "16G"
# CPUs in the pool (1 to the number of cores).
pool_cpus = 16
# Percent of MemTotal that is always left to the host.
reserve_floor_percent = 10
# Minimum free space on the state disk.
min_disk_free = "2G"
# Where task temp dirs ($TMPDIR = <dir>/aq-<uid>-<slice>/<id>) live. Unset: /tmp when it
# is tmpfs, else the state dir. Temp files on tmpfs count as task memory.
# tmp_dir = "/tmp"
# The queue holds while the temp dirs' filesystem has less free space or inodes.
min_tmp_free = "2G"
min_tmp_inodes = 100000
# MemoryHigh = task limit * this value (0 < x <= 1).
# 1.0: without swap, MemoryHigh < MemoryMax throttles a task forever instead of an OOM.
memory_high_ratio = 1.0
# Time a cancelled task gets to stop cleanly.
cancel_grace = "10s"

# For tests: slice name and unit prefix.
slice_name = "aq.slice"
unit_prefix = "aq-"

[pressure]
# Close admission when PSI memory full avg10 >= this value for longer than close_after.
close_full_avg10 = 5.0
close_after = "10s"
# Reopen when avg10 stays below this value for longer than open_after.
open_full_avg10 = 1.0
open_after = "30s"

[logs]
# Maximum kept size of a task's stdout/stderr.
max_stdout = "64M"
max_stderr = "64M"

[reservations]
# Maximum reservation lifetime (the TTL counts from the grant).
max_ttl = "24h"
# How long before expiry a reservation turns EXPIRING and a warning is sent.
expiry_warning = "15m"
# Time limit for the teardown script.
teardown_timeout = "5m"
# Memory of one teardown (64M to pool_memory).
teardown_memory = "512M"
# How many teardowns may run at once (at least 1).
teardown_concurrency = 2
# Tell the holder when a reservation with --docker-project has had no nested
# task running and no container for this long ("0s" turns it off).
idle_after = "10m"

[notify]
# Delivery retries: minimum and maximum delay.
retry_min = "1s"
retry_max = "5m"
# Timeout of one attempt, and how long a failing delivery keeps retrying.
delivery_timeout = "30s"
give_up_after = "24h"
# Operator alert thresholds for closed admission and a stuck cleanup.
admission_closed_alert = "10m"
cleaning_stuck_alert = "5m"

# This list replaces the default adapters entirely; the order decides the session.
[[agents]]
name = "codex"
identity_env = "CODEX_THREAD_ID"
delivery = "push"
command = ["codex", "queue", "--thread", "{session}", "--message", "{text}"]

[[agents]]
name = "claude"
identity_env = "CLAUDE_CODE_SESSION_ID"
delivery = "client-wait"

[webhook]
# An empty URL disables operator alerts. The token is read on every attempt.
url = ""
token_file = ""
timeout = "10s"
# Request body: "aq" (the event as JSON) or "gong" (a Gong /notify request that
# Gong relays to Telegram; put Gong's api_token in token_file).
format = "aq"

[hook]
# Soft hints: parallel pytest, compose and docker run.
patterns = [
  '(^|[\s;&|(])(pytest|py\.test)\b.*\s(-n|--numprocesses)(\s|=)',
  '(^|[\s;&|(])docker\s+compose\b.*\s(up|run)\b',
  '(^|[\s;&|(])docker-compose\b.*\s(up|run)\b',
  '(^|[\s;&|(])docker\s+run\b',
]

[profiles]
# Window of usable runs, memory/duration percentiles and the limit margin.
window = 10
memory_percentile = 90
duration_percentile = 90
limit_margin = 1.2

[scheduler]
# Let later items start ahead of a blocked queue head when they cannot delay it.
backfill = true

[retention]
# Age and total size limits for logs of finished items; active logs are kept.
logs_max_age = "7d"
logs_max_total = "5G"
# History of items, events, runs and rotated hook files.
history_max_age = "90d"
# Host sample lifetime, and full resolution before thinning to 10-minute buckets.
samples_max_age = "30d"
samples_full_res = "2d"

[stats]
# Host sampling period and agent process names: Claude Code (claude), OpenClaude
# (openclaude) and Codex (codex).
sample_interval = "30s"
agent_processes = ["claude", "openclaude", "codex"]

[disk]
# Disk-write alarm: fires when the host writes at least this many bytes per
# hour, judged over the window below. "0" turns the alarm off.
alert_rate = "50G"
# Window the rate is judged over; at least 5 x stats.sample_interval while the
# alarm is on. Unset: 10m, or 5 x stats.sample_interval when that is longer.
alert_window = "10m"

[tmp]
# Time between scans of /tmp.
scan_interval = "10m"
# Minimum time since the last write before an item can be an orphan or candidate.
orphan_after = "24h"
# /tmp fullness threshold, using the higher of byte and inode usage.
# Percent values accept an optional % suffix. "0" turns the alarm off.
alert_full = "70%"
# Total size threshold for orphans and candidates. "0" turns the alarm off.
alert_orphans = "2G"

[sessions]
# How long an agent session with known idle time must be idle to count.
idle_after = "12h"
# Total memory threshold for agent sessions and their runs. "0" turns the alarm off.
alert_memory = "6G"
# Number of idle sessions that triggers an alarm. 0 turns the alarm off.
alert_idle_count = 3

[host]
# Swap usage threshold as a percent. "0" turns the alarm off.
alert_swap = "75%"

[alerts]
# Averaging window for the /tmp fullness, swap and session alarms.
# At least 5 x stats.sample_interval. Unset uses 10m or five intervals if longer.
window = "10m"
