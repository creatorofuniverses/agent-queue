# Example aq configuration: ~/.config/agent-queue/config.toml
# Every key is shown with its default value.

# Memory of the task pool. Must not exceed MemTotal minus the reserve floor.
pool_memory = "16G"
# CPUs in the pool (1 to the number of cores).
pool_cpus = 16
# Percent of MemTotal that is always left to the host.
reserve_floor_percent = 10
# Minimum free space on the state disk.
min_disk_free = "2G"
# MemoryHigh = task limit * this value (0 < x <= 1).
# 1.0: without swap, MemoryHigh < MemoryMax throttles a task forever instead of an OOM.
memory_high_ratio = 1.0
# Time a cancelled task gets to stop cleanly.
cancel_grace = "10s"

# For tests: slice name and unit prefix.
slice_name = "aq.slice"
unit_prefix = "aq-"

[pressure]
# Close admission when PSI memory full avg10 >= this value for longer than close_after.
close_full_avg10 = 5.0
close_after = "10s"
# Reopen when avg10 <= this value for longer than open_after.
open_full_avg10 = 1.0
open_after = "30s"

[logs]
# Maximum kept size of a task's stdout/stderr.
max_stdout = "64M"
max_stderr = "64M"

[reservations]
# Maximum reservation lifetime (the TTL counts from the grant).
max_ttl = "24h"
# How long before expiry a reservation turns EXPIRING and a warning is sent.
expiry_warning = "15m"
# Time limit for the teardown script.
teardown_timeout = "5m"
# Memory of one teardown (64M to pool_memory).
teardown_memory = "512M"
# How many teardowns may run at once (at least 1).
teardown_concurrency = 2

[notify]
# Delivery retries: minimum and maximum delay.
retry_min = "1s"
retry_max = "5m"
# Timeout of one attempt, and how long a failing delivery keeps retrying.
delivery_timeout = "30s"
give_up_after = "24h"
# Operator alert thresholds for closed admission and a stuck cleanup.
admission_closed_alert = "10m"
cleaning_stuck_alert = "5m"

# This list replaces the default adapters entirely; the order decides the session.
[[agents]]
name = "codex"
identity_env = "CODEX_THREAD_ID"
delivery = "push"
command = ["codex", "queue", "--thread", "{session}", "--message", "{text}"]

[[agents]]
name = "claude"
identity_env = "CLAUDE_CODE_SESSION_ID"
delivery = "client-wait"

[webhook]
# An empty URL disables operator alerts. The token is read on every attempt.
url = ""
token_file = ""
timeout = "10s"

[hook]
# Soft hints: parallel pytest, compose and docker run.
patterns = [
  '(^|[\s;&|(])(pytest|py\.test)\b.*\s(-n|--numprocesses)(\s|=)',
  '(^|[\s;&|(])docker\s+compose\b.*\s(up|run)\b',
  '(^|[\s;&|(])docker-compose\b.*\s(up|run)\b',
  '(^|[\s;&|(])docker\s+run\b',
]

[profiles]
# Window of usable runs, memory/duration percentiles and the limit margin.
window = 10
memory_percentile = 90
duration_percentile = 90
limit_margin = 1.2

[scheduler]
# Let later items start ahead of a blocked queue head when they cannot delay it.
backfill = true

[retention]
# Age and total size limits for logs of finished items; active logs are kept.
logs_max_age = "7d"
logs_max_total = "5G"
# History of items, events, runs and rotated hook files.
history_max_age = "90d"
# Host sample lifetime, and full resolution before thinning to 10-minute buckets.
samples_max_age = "30d"
samples_full_res = "2d"

[stats]
# Host sampling period and agent process names.
sample_interval = "30s"
agent_processes = ["claude", "codex"]
