# Пример конфигурации aq: ~/.config/agent-queue/config.toml
# Все ключи показаны со значениями по умолчанию.

# Память пула задач. Должна быть не больше MemTotal минус резерв.
pool_memory = "16G"
# Число CPU в пуле (от 1 до числа ядер).
pool_cpus = 16
# Процент MemTotal, который всегда остаётся хосту.
reserve_floor_percent = 10
# Минимум свободного места на диске состояния.
min_disk_free = "2G"
# MemoryHigh = лимит задачи * это значение (0 < x <= 1).
# 1.0: без swap MemoryHigh < MemoryMax бесконечно тормозит задачу вместо OOM.
memory_high_ratio = 1.0
# Время на корректную остановку задачи при отмене.
cancel_grace = "10s"

# Для тестов: имя slice и префикс unit.
slice_name = "aq.slice"
unit_prefix = "aq-"

[pressure]
# Закрыть приём новых задач, если PSI memory full avg10 >= значения дольше close_after.
close_full_avg10 = 5.0
close_after = "10s"
# Открыть снова, если avg10 <= значения дольше open_after.
open_full_avg10 = 1.0
open_after = "30s"

[logs]
# Максимальный размер сохраняемого stdout/stderr задачи.
max_stdout = "64M"
max_stderr = "64M"

[reservations]
# Максимальный срок резерва (TTL отсчитывается от выдачи).
max_ttl = "24h"
# За сколько до истечения резерв переходит в EXPIRING и шлётся предупреждение.
expiry_warning = "15m"
# Предел времени на выполнение скрипта снятия.
teardown_timeout = "5m"
# Память одного снятия (от 64M до pool_memory).
teardown_memory = "512M"
# Сколько снятий может идти одновременно (не меньше 1).
teardown_concurrency = 2

[notify]
# Повторы доставки: минимальная и максимальная задержка.
retry_min = "1s"
retry_max = "5m"
# Таймаут попытки и срок, после которого неудачная доставка сдаётся.
delivery_timeout = "30s"
give_up_after = "24h"
# Пороги тревог оператора о закрытом допуске и зависшей очистке.
admission_closed_alert = "10m"
cleaning_stuck_alert = "5m"

# Список заменяет адаптеры по умолчанию целиком; порядок определяет сессию.
[[agents]]
name = "codex"
identity_env = "CODEX_THREAD_ID"
delivery = "push"
command = ["codex", "queue", "--thread", "{session}", "--message", "{text}"]

[[agents]]
name = "claude"
identity_env = "CLAUDE_CODE_SESSION_ID"
delivery = "client-wait"

[webhook]
# Пустой URL отключает уведомления оператора. Токен читается при каждой попытке.
url = ""
token_file = ""
timeout = "10s"

[hook]
# Мягкие предупреждения: pytest с параллелизмом, compose и docker run.
patterns = [
  '(^|[\s;&|(])(pytest|py\.test)\b.*\s(-n|--numprocesses)(\s|=)',
  '(^|[\s;&|(])docker\s+compose\b.*\s(up|run)\b',
  '(^|[\s;&|(])docker-compose\b.*\s(up|run)\b',
  '(^|[\s;&|(])docker\s+run\b',
]
